<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Daily Reset List">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>html { background-color: #000; }</style>
    <script>
        if (window.location.pathname === '/') {
            const root = document.documentElement;
            root.setAttribute('data-public-landing', 'true');
            root.setAttribute('data-theme', 'dark');
            root.setAttribute('data-theme-style', 'space');
            root.setAttribute('data-density', 'comfortable');
            root.setAttribute('data-graphics', 'true');
            root.style.colorScheme = 'dark';
        }
    </script>
    <meta name="description" content="Daily Reset List helps you organize tasks, keep routines simple, and stay on top of your daily checklist." />
    <title>Daily Reset List | A Calmer Daily Task List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&amp;family=Nunito:wght@400..800&amp;display=swap"
        rel="stylesheet"
        media="print"
        onload="this.media='all'"
    >
    <noscript>
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&amp;family=Nunito:wght@400..800&amp;display=swap" rel="stylesheet">
    </noscript>
